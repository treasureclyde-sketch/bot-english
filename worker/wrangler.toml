name = "learning-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Крон-триггер: раз в минуту дёргает scheduled() — это «сердце» напоминаний.
[triggers]
crons = ["* * * * *"]

# Публичная (не секретная) переменная — твой Telegram user_id.
# Секреты BOT_TOKEN и WEBHOOK_SECRET задаются через `wrangler secret put`.
[vars]
OWNER_ID = "0"

# База D1. account-level id подставит `wrangler d1 create` (см. worker/README.md).
[[d1_databases]]
binding = "DB"
database_name = "learning-bot-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
